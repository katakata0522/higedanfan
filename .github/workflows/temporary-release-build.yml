name: クイズ更新の配信物を一時ビルド

on:
  push:
    branches: [temp/quiz-refresh-build-20261109]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Confirm the parent is the reviewed source
        run: test "$(git rev-parse HEAD^)" = abca0a7ecd6c568d5a5cec5343eb41980162dd46
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: higedanfan-quiz-refresh-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
