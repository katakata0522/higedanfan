name: 楽曲ガイドの検証

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: song-guide-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # package-lock.json と同じ版の Chromium・フォント・OS依存を使う。
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --prefer-offline --no-audit --no-fund

      - name: Run lint and unit tests
        run: |
          set -euo pipefail
          npm run lint
          npm test
          node --test .github/scripts/announcement-ci-scope.test.mjs

      - name: Select browser verification scope
        id: browser
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          scope="$(node .github/scripts/announcement-ci-scope.mjs)"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        run: |
          set -euo pipefail
          npm run build

      - name: Verify generated HTML consistency on scoped change
        if: steps.browser.outputs.scope != 'full'
        run: |
          set -euo pipefail
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code HEAD -- '*.html'

      - name: Verify bundled Chromium matches locked Playwright
        if: steps.browser.outputs.scope != 'docs'
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { driverVersion } = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(require('playwright/package.json').version, driverVersion);
          fs.accessSync(require('playwright').chromium.executablePath(), fs.constants.X_OK);
          NODE

      - name: Run scoped browser verification
        if: steps.browser.outputs.scope != 'docs'
        env:
          BROWSER_SCOPE: ${{ steps.browser.outputs.scope }}
        run: |
          set -euo pipefail
          case "$BROWSER_SCOPE" in
            announcements|home|tour) npm run test:browser -- "--$BROWSER_SCOPE-only" ;;
            full) npm run test:browser ;;
            *) exit 1 ;;
          esac

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: higedanfan-verify-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout lockfile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=moderate
