name: 楽曲ガイドの検証

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: song-guide-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # package-lock.json と同じ版の Chromium・フォント・OS依存を使う。
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: node --test .github/scripts/announcement-ci-scope.test.mjs
      - name: ブラウザー検証の範囲を選ぶ
        id: browser
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          scope=$(node .github/scripts/announcement-ci-scope.mjs)
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: 限定検証の生成HTMLを照合する
        if: steps.browser.outputs.scope != 'full'
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code HEAD -- '*.html'
      - name: Verify the bundled Chromium matches the locked Playwright
        if: steps.browser.outputs.scope != 'docs'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { driverVersion } = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(require('playwright/package.json').version, driverVersion);
          fs.accessSync(require('playwright').chromium.executablePath(), fs.constants.X_OK);
          NODE
      - name: 変更範囲のブラウザー検証
        if: steps.browser.outputs.scope != 'docs'
        env:
          BROWSER_SCOPE: ${{ steps.browser.outputs.scope }}
        run: |
          case "$BROWSER_SCOPE" in
            announcements|home|tour) npm run test:browser -- "--$BROWSER_SCOPE-only" ;;
            full) npm run test:browser ;;
            *) exit 1 ;;
          esac
